name: tickgit TODO guard
description: Detect new TODO-style comments by comparing tickgit output to a committed baseline.
inputs:
  path:
    description: Repository path to scan, relative to the workflow workspace.
    required: false
    default: "."
  baseline-file:
    description: Baseline CSV file, relative to the workflow workspace.
    required: false
    default: ".github/tickgit-baseline.csv"
  fail-on-new:
    description: Exit non-zero when current findings contain TODOs not present in the baseline.
    required: false
    default: "true"
  match-phrases:
    description: Comma-separated phrase list to match instead of tickgit defaults.
    required: false
    default: ""
  ignore-paths:
    description: Comma-separated path patterns to ignore in addition to tickgit defaults.
    required: false
    default: ""
  changed-only:
    description: On pull requests and pushes, scan only files changed from the event base commit.
    required: false
    default: "true"
  base-sha:
    description: Optional explicit base commit for changed-only scanning.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install verified tickgit release
      id: install
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/tickgit-action"
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)
            asset="tickgit_linux_amd64.tar.gz"
            checksum="047c9fd3d2d12025b1e583c69de26217a60f9ed5f721d991873862457d901c9f"
            ;;
          Linux-ARM64)
            asset="tickgit_linux_arm64.tar.gz"
            checksum="79f570d39f9d7baff154b6d5ad56e0e0d7d912da504841f02c84cdf5d04a731f"
            ;;
          macOS-X64)
            asset="tickgit_darwin_amd64.tar.gz"
            checksum="3d4a569c151f9c042daf5f09d23f87c63d125513400e27f4bd221098cf35710d"
            ;;
          macOS-ARM64)
            asset="tickgit_darwin_arm64.tar.gz"
            checksum="e1f8f749e9263b0ee533c0ff4809ae09eaf4ca15f9fddaba53c7ea2131a0c5fe"
            ;;
          Windows-X64)
            asset="tickgit_windows_amd64.zip"
            checksum="65fd66a18f744cdfab263b940b56c6e511bfef2866c3a0edb4389cadd41604ed"
            ;;
          *)
            echo "Unsupported runner platform: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 1
            ;;
        esac
        archive="$RUNNER_TEMP/tickgit-action/$asset"
        curl -fsSL "https://github.com/MTG-Thomas/tickgit/releases/download/v0.0.18/$asset" -o "$archive"
        echo "$checksum  $archive" | sha256sum --check -
        tar -xf "$archive" -C "$RUNNER_TEMP/tickgit-action"
        chmod +x "$RUNNER_TEMP/tickgit-action/tickgit" 2>/dev/null || true
        binary="$RUNNER_TEMP/tickgit-action/tickgit"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          binary="$binary.exe"
        fi
        echo "bin=$binary" >> "$GITHUB_OUTPUT"

    - name: Run tickgit baseline check
      shell: bash
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"
        args=("--csv-output" "--baseline-file" "${{ inputs.baseline-file }}")
        base_sha="${{ inputs.base-sha }}"
        if [[ -z "$base_sha" ]]; then
          base_sha="${{ github.event.pull_request.base.sha }}"
        fi
        if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
          base_sha="${{ github.event.before }}"
        fi
        if [[ "${{ inputs.changed-only }}" == "true" && -n "$base_sha" && ! "$base_sha" =~ ^0+$ ]]; then
          git_safe=(git -c "safe.directory=$GITHUB_WORKSPACE")
          if ! "${git_safe[@]}" cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            "${git_safe[@]}" fetch --no-tags --depth=1 origin "$base_sha"
          fi
          include_file="$RUNNER_TEMP/tickgit-action/changed-files.txt"
          "${git_safe[@]}" diff --name-only --diff-filter=ACMR "$base_sha...HEAD" -- "${{ inputs.path }}" > "$include_file"
          if [[ ! -s "$include_file" ]]; then
            echo "tickgit diff check: no changed files to scan"
            exit 0
          fi
          args+=("--include-path-file" "$include_file")
          echo "tickgit diff check: scanning $(wc -l < "$include_file") changed file(s)"
        fi
        if [[ "${{ inputs.fail-on-new }}" == "true" ]]; then
          args+=("--fail-on-new")
        fi
        if [[ -n "${{ inputs.match-phrases }}" ]]; then
          args+=("--match-phrase" "${{ inputs.match-phrases }}")
        fi
        if [[ -n "${{ inputs.ignore-paths }}" ]]; then
          args+=("--ignore-path" "${{ inputs.ignore-paths }}")
        fi
        "${{ steps.install.outputs.bin }}" "${args[@]}" "${{ inputs.path }}"
